[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

addopts =
    --verbose
    --strict-markers
    --tb=short

# Markers for test organization
markers =
    unit: Unit tests for individual components
    integration: End-to-end pipeline tests
    slow: Tests that take longer to run

# Note: a per-test timeout requires the optional pytest-timeout plugin. It is
# not declared here so the suite runs against a bare pytest + pytest-cov
# install; run_tests.sh enforces an overall wall-clock timeout instead.
